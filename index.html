<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo Pam V3</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
        h1 { color: #22c55e; font-size: 24px; margin-bottom: 4px; }
        .badge { background: #1e293b; color: #38bdf8; font-size: 12px; padding: 4px 10px; border-radius: 12px; display: inline-block; margin-bottom: 15px; }
        .player { background: #1e293b; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #334155; position: sticky; top: 10px; z-index: 10; }
        #status { color: #22c55e; font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        audio { width: 100%; height: 40px; }
        input { width: 90%; max-width: 500px; padding: 12px; border-radius: 25px; border: none; font-size: 15px; margin-bottom: 15px; outline: none; }
        .card { background: #1e293b; padding: 14px; margin: 0 auto 10px auto; max-width: 550px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; text-align: left; border: 1px solid #334155; }
        button { background: #22c55e; color: #052e16; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>📻 Radyo Pam</h1>
    <div class="badge">Vèsyon 3.0 • Nouvèl & Mizik</div>

    <div class="player">
        <div id="status">Peze "Koute" sou yon radyo anba a</div>
        <audio id="player" controls playsinline></audio>
    </div>

    <input type="text" id="search" onkeyup="filterRadios()" placeholder="🔍 Chèche yon radyo (ex: RFI, Kompa, Caraibes)...">

    <div id="list"></div>

    <script>
        const radios = [
            { name: "RFI Afrique (Nouvèl)", desc: "Nouvèl an dirèk • Entènasyonal", url: "https://infomaniak.ch" },
            { name: "RFI Monde (Nouvèl)", desc: "Nouvèl entènasyonal", url: "https://infomaniak.ch" },
            { name: "Tropiques FM", desc: "Kompa, Zouk & Mizik Karayib", url: "https://infomaniak.ch" },
            { name: "Radio Caraïbes (Zeno)", desc: "Ayiti • Nouvèl & Mizik", url: "https://zeno.fm" },
            { name: "Radyo Kiskeya (Zeno)", desc: "Ayiti • Nouvèl", url: "https://zeno.fm" },
            { name: "Radio Mega (Zeno)", desc: "Ayiti • Nouvèl", url: "https://zeno.fm" },
            { name: "Radio Vision 2000 (Zeno)", desc: "Ayiti • Nouvèl", url: "https://zeno.fm" },
            { name: "Chokarella Radio", desc: "Ayiti • Mizik & Kilti", url: "https://zeno.fm" },
            { name: "Generations Rap/RnB", desc: "Mizik Hip-Hop & RnB", url: "https://infomaniak.ch" }
        ];

        const list = document.getElementById("list");
        const player = document.getElementById("player");
        const status = document.getElementById("status");

        function render(items) {
            list.innerHTML = "";
            items.forEach(r => {
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <div>
                        <div style="font-weight:bold; font-size:16px;">${r.name}</div>
                        <div style="color:#94a3b8; font-size:12px;">${r.desc}</div>
                    </div>
                    <button onclick="play('${r.name}', '${r.url}')">▶️ Koute</button>
                `;
                list.appendChild(div);
            });
        }

        function filterRadios() {
            const q = document.getElementById("search").value.toLowerCase();
            const filtered = radios.filter(r => r.name.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q));
            render(filtered);
        }

        function play(name, url) {
            status.textContent = "⏳ Ap konekte ak: " + name + "...";
            player.src = url;
            player.play().then(() => {
                status.textContent = "🔊 Ap jwe: " + name;
            }).catch(e => {
                status.textContent = "⚠️ Radyo sa a pa disponib kounye a. Eseye yon lòt.";
            });
        }

        render(radios);
    </script>
</body>
</html>
