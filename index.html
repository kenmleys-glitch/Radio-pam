<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo Pam - Nouvèl ak Mizik</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #1DB954; font-size: 24px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        input { padding: 12px; width: 65%; border-radius: 25px; border: none; font-size: 16px; outline: none; }
        button { padding: 12px 20px; border-radius: 25px; border: none; background-color: #1DB954; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .filters { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { background-color: #282828; font-size: 14px; padding: 8px 15px; }
        .player-box { background-color: #282828; padding: 15px; border-radius: 15px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #now-playing { font-weight: bold; color: #1DB954; margin-bottom: 10px; font-size: 16px; }
        audio { width: 100%; height: 40px; }
        .station-list { list-style: none; padding: 0; max-width: 600px; margin: 0 auto; text-align: left; }
        .station-item { background-color: #181818; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .station-item:hover { background-color: #282828; }
        .station-name { font-weight: bold; font-size: 16px; }
        .station-country { font-size: 12px; color: #b3b3b3; }
    </style>
</head>
<body>

    <h1>📻 Radyo Pam</h1>

    <div class="player-box">
        <div id="now-playing">Chwazi yon radyo anba a pou koute</div>
        <audio id="audio-player" controls></audio>
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Ekri non radyo a (ex: Caraibes, Kompa)...">
        <button onclick="searchRadio()">Chèche</button>
    </div>

    <div class="filters">
        <button class="filter-btn" onclick="loadHaiti()">🇭🇹 Radyo Ayiti</button>
        <button class="filter-btn" onclick="searchByTag('news')">📰 Nouvèl</button>
        <button class="filter-btn" onclick="searchByTag('kompa')">🎶 Kompa / Mizik</button>
    </div>

    <ul class="station-list" id="station-list"></ul>

    <script>
        const servers = [
            "https://radio-browser.info",
            "https://radio-browser.info",
            "https://radio-browser.info"
        ];
        const stationList = document.getElementById("station-list");
        const audioPlayer = document.getElementById("audio-player");
        const nowPlaying = document.getElementById("now-playing");

        // Radyo Ayiti popilè ki chaje touswit
        const defaultHaitiStations = [
            { name: "Radio Télé Caraïbes (94.5 FM)", country: "Ayiti - Nouvèl & Mizik", url_resolved: "https://zeno.fm" },
            { name: "Radio Mega Haiti (103.7 FM)", country: "Ayiti - Nouvèl", url_resolved: "https://zeno.fm" },
            { name: "Radyo Kiskeya (88.5 FM)", country: "Ayiti - Nouvèl", url_resolved: "https://zeno.fm" },
            { name: "Radio Télé Zenith (102.5 FM)", country: "Ayiti - Nouvèl & Deba", url_resolved: "https://zeno.fm" },
            { name: "Radio Vision 2000 (99.3 FM)", country: "Ayiti - Nouvèl", url_resolved: "https://zeno.fm" },
            { name: "Radio Metropole Haiti (100.1 FM)", country: "Ayiti - Nouvèl", url_resolved: "https://zeno.fm" },
            { name: "Radio Scoop FM (107.7 FM)", country: "Ayiti - Nouvèl", url_resolved: "https://zeno.fm" },
            { name: "Radio Galaxie (104.5 FM)", country: "Ayiti - Kompa & Mizik", url_resolved: "https://zeno.fm" },
            { name: "Chokarella Radio", country: "Ayiti - Mizik & Kilti", url_resolved: "https://zeno.fm" }
        ];

        function displayStations(stations) {
            stationList.innerHTML = "";
            if (!stations || stations.length === 0) {
                stationList.innerHTML = "<p style='text-align:center;'>Pa gen radyo ki jwenn pou rechèch sa a.</p>";
                return;
            }
            stations.forEach(station => {
                const streamUrl = station.url_resolved || station.url;
                if (streamUrl) {
                    const li = document.createElement("li");
                    li.className = "station-item";
                    li.innerHTML = `
                        <div>
                            <div class="station-name">${station.name}</div>
                            <div class="station-country">${station.country || 'Entènasyonal'}</div>
                        </div>
                        <button style="padding: 8px 15px; font-size: 14px;">▶️ Koute</button>
                    `;
                    li.onclick = () => playStation(station.name, streamUrl);
                    stationList.appendChild(li);
                }
            });
        }

        function playStation(name, url) {
            nowPlaying.textContent = "Ap konekte ak: " + name + "...";
            audioPlayer.src = url;
            audioPlayer.play()
                .then(() => {
                    nowPlaying.textContent = "🔊 Ap jwe: " + name;
                })
                .catch(err => {
                    nowPlaying.textContent = "⚠️ Radyo sa a pa an dirèk kounye a. Eseye yon lòt.";
                });
        }

        async function fetchFromServers(path) {
            for (let base of servers) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(`${base}${path}`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (res.ok) return await res.json();
                } catch (e) {
                    continue;
                }
            }
            return null;
        }

        async function loadHaiti() {
            displayStations(defaultHaitiStations);
            const data = await fetchFromServers(`/bycountrycodeexact/HT?limit=30&order=clickcount&reverse=true`);
            if (data && data.length > 0) {
                displayStations([...defaultHaitiStations, ...data]);
            }
        }

        async function searchRadio() {
            const query = document.getElementById("search-input").value.trim();
            if (!query) return;
            stationList.innerHTML = "<p style='text-align:center;'>Ap chèche...</p>";
            
            // Chèche nan lis lokal la dabò
            const localMatches = defaultHaitiStations.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
            const data = await fetchFromServers(`/byname/${encodeURIComponent(query)}?limit=30&order=clickcount&reverse=true`);
            
            const results = [...localMatches, ...(data || [])];
            displayStations(results);
        }

        async function searchByTag(tag) {
            stationList.innerHTML = "<p style='text-align:center;'>Ap chèche...</p>";
            const data = await fetchFromServers(`/bytag/${encodeURIComponent(tag)}?limit=30&order=clickcount&reverse=true`);
            if (data && data.length > 0) {
                displayStations(data);
            } else {
                stationList.innerHTML = "<p style='text-align:center;'>Pa gen koneksyon ak sèvè a. Klike sou Radyo Ayiti.</p>";
            }
        }

        loadHaiti();
    </script>
</body>
</html>
